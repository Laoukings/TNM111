<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Star Wars Character Interactions</title>
    
    <!-- D3.js v7 from CDN -->
    <script src="https://d3js.org/d3.v7.min.js"></script>
    
    <!-- Link to external CSS file -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>  
    <div id="container" style="display: flex;">
        <div id="left-column">
            <label for="episode-select">Select Episode (Graph 1 & 2):</label>
            <select id="episode-select">
                <option value="0">Episode 1</option>
                <option value="1">Episode 2</option>
                <option value="2">Episode 3</option>
                <option value="3">Episode 4</option>
                <option value="4">Episode 5</option>
                <option value="5">Episode 6</option>
                <option value="6">Episode 7</option>
                <option value="7">Full Data</option>
            </select>
            <div id="graph"></div>
            <div id="graph2-container">
                <div id="graph2"></div>
            </div>
        </div>
    
        <div id="right-column">
            <label for="episode-select-3">Select Episode (Graph 3 & 4):</label>
            <select id="episode-select-3">
                <option value="0">Episode 1</option>
                <option value="1">Episode 2</option>
                <option value="2">Episode 3</option>
                <option value="3">Episode 4</option>
                <option value="4">Episode 5</option>
                <option value="5">Episode 6</option>
                <option value="6">Episode 7</option>
                <option value="7">Full Data</option>
            </select>
            <div id="graph3"></div>
            <div id="graph4-container">
                <div id="graph4"></div>
            </div>
        </div>

        <div id="controls-column">
            <div class="filter-controls">
                <div>
                    <label>Node Value Filter (Graph 1 & 2):</label>
                    <input type="range" id="node-value-slider" min="0" max="61" value="0">
                    <span id="node-value-display">0</span>
                </div>
                <div>
                    <label>Edge Value Filter (Graph 3 & 4):</label>
                    <input type="range" id="edge-value-slider" min="0" max="26" value="0">
                    <span id="edge-value-display">0</span>
                </div>
                <div>
                    <label>
                        <input type="checkbox" id="common-nodes-only">
                        Show only common nodes between graphs
                    </label>
                </div>
            </div>
        </div>
    </div>
    
    <script src="js/main.js"></script>
</body>
</html>
