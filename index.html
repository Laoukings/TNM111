<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Star Wars Character Interactions</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="control-panel">
        <h3>Control Panel</h3>
        <label for="episode-select">Select Episode:</label>
        <select id="episode-select">
            <option value="0">Episode 1</option>
            <option value="1">Episode 2</option>
            <option value="2">Episode 3</option>
            <option value="3">Episode 4</option>
            <option value="4">Episode 5</option>
            <option value="5">Episode 6</option>
            <option value="6">Episode 7</option>
            <option value="7">Full Data</option>
        </select>
    </div>
    <div id="graph"></div>
    <div id="graph2"></div> <!-- Second graph container -->
    <script src="js/main.js"></script>
</body>
</html>
